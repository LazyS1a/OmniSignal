title = "OmniSignal secret scanning"
minVersion = "8.30.1"

[extend]
useDefault = true

[[allowlists]]
description = "Downloaded tools, package environments, scanner databases, and generated reports"
paths = [
  '''(^|/)\.tools/''',
  '''(^|/)\.venv/''',
  '''(^|/)\.bootstrap-venv/''',
  '''(^|/)sbom/.*\.json$''',
  '''(^|/)data/''',
  '''(^|/)backups/''',
  '''(^|/)tmp/''',
  '''(^|/)artifacts/private/''',
]
