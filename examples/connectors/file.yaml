spec_version: "1.0"
id: fixture_file
display_name: Local file fixture
connector_version: "0.1.0"
kind: file
risk_level: standard
capabilities: [incremental, replay]
allowed_targets: ["fixtures/input/*.json"]
field_allowlist: [source_record_id, published_at, title, text]
output_schema_version: "1.0"
auth: {kind: none}
pagination: {kind: none, page_size: 100, max_pages: 1}
extractor: {kind: jsonpath, selector: "$[*]"}
checkpoint: {strategy: timestamp, commit_every: 100}
deletion: {mode: full_resync, target_hours: 24}
isolation: {mode: in_process, kill_switch: true}
limits: {timeout_seconds: 30, max_attempts: 1, requests_per_minute: 60, max_concurrency: 1, max_records_per_run: 10000}
