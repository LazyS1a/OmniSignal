name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install pinned uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.8"
          python-version: "3.12.9"
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --frozen --group dev

      - name: Run contract and runtime tests
        run: uv run pytest -q

      - name: Compile source and migrations
        run: uv run python -m compileall -q src tests migrations

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      OMNISIGNAL_DB_PASSWORD: ci-build-only-placeholder
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Build runtime images
        run: docker compose build

      - name: Scan Dockerfiles
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: "v0.74.0"
          scan-type: config
          scan-ref: .
          scanners: misconfig
          severity: HIGH,CRITICAL
          exit-code: "1"
          trivyignores: .trivyignore.yaml

      - name: Scan API image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: "v0.74.0"
          image-ref: omnisignal-api:latest
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: "1"

      - name: Scan PostgreSQL image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: "v0.74.0"
          image-ref: omnisignal-postgres:18.6-alpine3.23
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: "1"
