name: Advertising workbench
on:
  push:
    branches: [variant/ad-workbench]
  pull_request:
    branches: [variant/ad-workbench]
permissions:
  contents: read
concurrency:
  group: ad-workbench-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.12.8"
          python-version: "3.12.9"
      - run: uv sync --frozen --group dev --extra ui --extra crawl
      - run: uv run pytest -q
      - run: uv run python -m compileall -q src tests
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci && npm run build
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:smoke
        working-directory: frontend
        env:
          SMOKE_PYTHON: ${{ github.workspace }}/.venv/bin/python
