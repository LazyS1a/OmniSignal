registry_version: 1
updated_at: "2026-09-03"

# 真实来源不得直接复制这些默认值。status 变为 allowed 前，必须逐项确认授权、字段、频率和删除方式。
defaults:
  raw_retention_days: 30
  normalized_retention_days: 180
  operational_log_retention_days: 90
  security_audit_retention_days: 365
  backup_retention_days: 30
  deletion_target_hours: 24
  external_processing: disabled

classifications:
  public: "允许公开的内容或完全合成的测试数据"
  internal: "运行元数据、配置版本和非敏感统计"
  restricted: "授权后才可查看的原文、用户表达或业务数据"
  secret: "凭证、Cookie、Token、私钥和签名材料；禁止进入采集记录"

field_catalog:
  visibility_snapshot:
    origin: source_and_deterministic_processor
    purpose: "有界视频检索快照：查询、采集时间、版本、视频链接/标题/频道ID、匹配证据、有效分母和采样比例；最多50条"
    classification: restricted
  source_record_id:
    origin: source
    purpose: "幂等去重、更新和来源删除定位"
    classification: internal
  url:
    origin: source
    purpose: "证据回链和允许范围校验"
    classification: public
  published_at:
    origin: source
    purpose: "时间窗口和增量同步"
    classification: public
  collected_at:
    origin: system
    purpose: "新鲜度、审计和重放定位"
    classification: internal
  query:
    origin: source_or_connector_input
    purpose: "记录授权查询词或采集入口；不得把帖子文本伪装成搜索词"
    classification: restricted
  title:
    origin: source
    purpose: "检索和记录识别"
    classification: public
  text:
    origin: source
    purpose: "保存允许范围内的正文证据"
    classification: restricted
  engagement:
    origin: source
    purpose: "保留来源提供的中立互动计数"
    classification: public
  language:
    origin: source_or_processor
    purpose: "语言过滤和质量检查"
    classification: internal
  target_entity:
    origin: controlled_config_or_processor
    purpose: "按已配置实体查询，不输出产品判断"
    classification: internal
  raw_hash:
    origin: system
    purpose: "完整性校验、去重和重放比较"
    classification: internal
  permission:
    origin: registry
    purpose: "记录数据使用依据和范围"
    classification: internal
  schema_version:
    origin: system
    purpose: "兼容、迁移和可重放处理"
    classification: internal
  quality_status:
    origin: system
    purpose: "隔离字段缺失、漂移和异常记录"
    classification: internal
  related_query:
    origin: source
    purpose: "保存公开搜索联想词；不等同于搜索次数"
    classification: public
  platform:
    origin: connector_config
    purpose: "区分 Web Search 与 YouTube Search 的指标口径"
    classification: internal
  metric_type:
    origin: system
    purpose: "区分相对兴趣与联想排名，禁止伪装成绝对搜索量"
    classification: internal
  value:
    origin: source
    purpose: "保存来源返回的 0-100 指数或排名整数"
    classification: public
  unit:
    origin: system
    purpose: "显式记录 index_0_100 或 rank_1_best"
    classification: internal
  geo:
    origin: connector_config
    purpose: "记录查询地域范围"
    classification: internal
  time_window:
    origin: connector_config
    purpose: "记录趋势时间窗或每日联想快照"
    classification: internal
  observed_at:
    origin: source_or_system
    purpose: "记录指标对应日期，不用采集时间冒充观测日期"
    classification: internal
  is_partial:
    origin: source
    purpose: "标识 Google Trends 未结束周期"
    classification: internal
  scope:
    origin: system
    purpose: "记录共享尺度或联想快照范围"
    classification: internal
  comparison_group:
    origin: system
    purpose: "约束只有同一请求内的相对兴趣才可直接比较"
    classification: internal
  source_url:
    origin: source
    purpose: "回链到公开数据入口"
    classification: public
  collector_version:
    origin: system
    purpose: "跟踪 pytrends 与联想解析器版本"
    classification: internal
  engine:
    origin: connector_config_and_source
    purpose: "记录 SearXNG 单引擎切片的来源引擎，不混成无来源的统一排名"
    classification: internal
  category:
    origin: connector_config_and_source
    purpose: "记录 SearXNG 搜索类别"
    classification: internal
  position:
    origin: system
    purpose: "记录固定 query-engine 快照中的结果顺序，1 为首位"
    classification: public
  sample_complete:
    origin: system
    purpose: "标记配置范围内的快照是否无上游故障完成；不表示覆盖平台全部结果"
    classification: internal
  deleted_at:
    origin: source_or_system
    purpose: "触发级联删除并保留无正文的删除审计"
    classification: internal

prohibited_fields:
  - password
  - access_token
  - refresh_token
  - session_cookie
  - private_key
  - signing_secret
  - payment_card
  - government_id
  - precise_location
  - biometric_data

roles:
  admin: [registry_manage, connector_enable, secret_reference_manage, read, export, delete, audit_read]
  operator: [connector_enable, read_metadata, delete_request, audit_read]
  analyst: [read_normalized, export_approved]
  auditor: [read_metadata, audit_read]
  connector_worker: [write_scoped_source, checkpoint_scoped_source]

sources:
  - id: searxng_results
    display_name: "本机 SearXNG 检索结果快照"
    connector_class: api
    status: allowed
    owner: project_local
    purpose: "通过本机自建 SearXNG JSON API 采集有界、逐引擎的公开检索结果样本"
    authorization_basis: "用户控制的本机聚合实例；仅处理所选上游引擎返回的公开结果"
    terms_reference: "https://docs.searxng.org/dev/search_api.html; each configured upstream engine must be reviewed before activation"
    robots_policy: obey
    rate_budget_rpm: 12
    reviewed_at: "2026-09-06"
    allowed_targets: ["http://127.0.0.1:8888/search"]
    credential_ref: null
    field_allowlist: [source_record_id, query, engine, category, position, url, title, text, published_at, language, time_range, observed_at, scope, source_url, collector_version, sample_complete, quality_status]
    retention_profile: defaults
    deletion_mode: registry_request
    cascade_targets: [raw, normalized, cache, metric_materialization, export_reference, backup_expiry_queue]
    kill_switch: true
  - id: youtube_visibility
