use_default_settings: true

general:
  debug: false
  instance_name: "OmniSignal Local Search"

search:
  safe_search: 1
  autocomplete: ""
  formats:
    - html
    - json

server:
  secret_key: "overridden-by-SEARXNG_SECRET"
  limiter: false
  image_proxy: false

outgoing:
  request_timeout: 12.0
  max_request_timeout: 15.0

ui:
  default_locale: "en"
  query_in_title: false
  results_on_new_tab: false
